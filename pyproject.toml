[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "march_madness"
version = "0.0.1"
description = "Building predictions for NCAA basketball tournament"
authors = [
  { name = "Brandon Lester" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["march_madness"]
include = ["pyproject.toml", "march_madness/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["march_madness"]
force-sort-within-sections = true

